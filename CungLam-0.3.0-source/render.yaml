# Blueprint Render: web service chạy Docker + ổ đĩa cho SQLite.
# Cách dùng: Render Dashboard → New → Blueprint → chọn repo này.
services:
  - type: web
    name: cunglam
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: CUNGLAM_DB
        value: /app/data/cunglam.db
      - key: CUNGLAM_SEED
        value: "1" # đổi thành 0 khi chạy dữ liệu thật
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
    disk:
      name: cunglam-data
      mountPath: /app/data
      sizeGB: 1
