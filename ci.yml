name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Kiểm tra cú pháp
        run: |
          node --check server.js
          for file in $(find src public test tools -name "*.js" -not -path "*/node_modules/*"); do
            node --check "$file"
          done
      - name: Chạy test end-to-end
        run: node test/run.js
