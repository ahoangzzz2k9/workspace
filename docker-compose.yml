services:
  cunglam:
    build: .
    image: cunglam:0.3.0
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      CUNGLAM_DB: /app/data/cunglam.db
      CUNGLAM_SEED: "1" # đổi thành 0 khi chạy dữ liệu thật
      COOKIE_SECURE: auto
      TRUST_PROXY: "1"
    ports:
      # Chỉ mở cho reverse proxy trên cùng máy. Bỏ 127.0.0.1 nếu muốn truy cập LAN.
      - "127.0.0.1:4321:4321"
    volumes:
      - cunglam-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cunglam-data:
